<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening… | YOON</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><main class="hero"><div class="eyebrow">YOON</div><h1>OPEN DESTINATION</h1><p id="msg">Checking the destination…</p><p><a class="btn" id="go" href="#"><span>Continue to website</span><span>↗</span></a></p><p class="notice">You are leaving YOON and visiting a third-party website.</p></main></div><script>
const i=new URLSearchParams(location.search).get("i");let links=JSON.parse(localStorage.getItem("yoon_links")||"[]");let l=links[Number(i)]||null;
const go=document.getElementById("go"),msg=document.getElementById("msg");
if(l && /^https?:\/\//i.test(l.url)){go.href=l.url;msg.textContent=l.name+" — "+l.url}else{go.style.display="none";msg.textContent="This link is unavailable."}
</script></body></html>
